<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CineVault NG secure download page"><title>Preparing download | CineVault NG</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#080607;color:#f3eee5}.download-box{width:min(92%,560px);background:#171416;border:1px solid #3a3033;border-radius:18px;padding:32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}.download-box h1{margin:0 0 10px;font-size:clamp(25px,5vw,40px)}.download-box p{color:#b4aaa7;line-height:1.6}.download-title{color:#b79a61;font-weight:700}.progress{height:7px;background:#211c1f;border-radius:99px;overflow:hidden;margin:24px 0}.bar{height:100%;width:0;background:#b79a61;transition:width 1s linear}.download-action{display:inline-flex;align-items:center;justify-content:center;min-width:220px;padding:14px 24px;border-radius:10px;background:#5b1f2a;color:#f3eee5;text-decoration:none;font-weight:800;border:1px solid #8f784b}.download-action.disabled{opacity:.5;pointer-events:none}.small{font-size:13px}</style></head><body><main class="download-box"><div aria-hidden="true" style="font-size:42px;margin-bottom:8px">↓</div><h1>Preparing your download</h1><p id="status">Checking the CineVault download service…</p><div class="progress"><div class="bar" id="bar"></div></div><p class="download-title" id="title">Loading title…</p><a id="download" class="download-action disabled" href="#">Download Now</a><p class="small">For titles distributed by CineVault, download links are temporary and securely generated.</p></main><script>(async()=>{const qs=new URLSearchParams(location.search),title=qs.get('title')||'';const status=document.getElementById('status'),titleEl=document.getElementById('title'),bar=document.getElementById('bar'),btn=document.getElementById('download');titleEl.textContent=title||'Unknown title';if(!title){status.textContent='No movie title was supplied.';return}try{const r=await fetch('/downloads.json?v=20260904',{cache:'no-store'});const m=r.ok?await r.json():{};if(!m[title]){status.textContent='Direct download is not available for this title. Please use the legal viewing options on its movie page.';return}let n=5;status.textContent='Your secure download is being prepared…';bar.style.width='5%';const timer=setInterval(()=>{n--;bar.style.width=((6-n)*20)+'%';if(n<=0){clearInterval(timer);status.textContent='Your download is ready.';bar.style.width='100%';btn.href='/api/download?title='+encodeURIComponent(title);btn.classList.remove('disabled')}},1000)}catch(e){status.textContent='The download service could not be reached. Please try again.'}})();</script></body></html>
